name: Publish case study

# Same deployment shape as the blog agent, with two deliberate differences:
#
#   1. MONTHLY, not hourly. The corpus is finite — 30 projects — so there is no
#      reason to rush it, and each study is a page a prospect reads closely.
#   2. Publishes DIRECT to main, like the blog agent. This started as PR-review —
#      a case study names a real client, so a human merged — and moved to direct
#      once the gate stack could carry it: confidentiality, claims, status, entry
#      and MDX all abort rather than publish. `open_pr` on a manual run still
#      gives a review branch when you want one.
#
# Free on this public repo (public repos get unlimited Actions minutes), so there
# is no server to pay for. The site repo's own deploy workflow builds and runs
# `firebase deploy` once the PR is merged — this agent only touches git.

on:
  schedule:
    # 09:00 UTC on the 1st and 15th — two slots a month. Whether a study is
    # actually generated depends on STUDIES_PER_MONTH and on whether any project
    # has a clean brief; a run with nothing to do exits cheaply.
    - cron: "0 9 1,15 * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Force a specific project id (blank = let the queue choose)"
        type: string
        required: false
      dry_run:
        description: "Generate to output/ without touching git"
        type: boolean
        default: false
      open_pr:
        description: "Open a PR for review instead of publishing straight to main"
        type: boolean
        default: false

concurrency:
  group: publish-case-study
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write, so the heartbeat step below can commit to THIS repo. See the note
      # on that step: without a commit, GitHub disables the schedule.
      contents: write
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_BASE_URL: https://api.llmsrelay.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4.6
          ANTHROPIC_SMALL_FAST_MODEL: claude-haiku-4.5
          ANTHROPIC_STRATEGY_MODEL: claude-opus-4-8
          # Actions reserves the name GITHUB_TOKEN, so the secret is PUBLISH_TOKEN
          # and is mapped to the env var the app reads. Same convention as the
          # blog agent. GH_TOKEN is what the `gh` CLI authenticates with.
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_REPO: dkcodes121617/wizcodes_main_website
          GITHUB_BRANCH: main
          GIT_AUTHOR_NAME: WizCodes Case Study Bot
          GIT_AUTHOR_EMAIL: business@wizcodes.site
          # Spelled out rather than left to the config default, for the same reason
          # the models above are: the run log should record what the run actually
          # used, and config.py is not readable after the fact.
          INDEXNOW_KEY: 2df4018dbb1444e6bc48faf84fc0ff39
          STUDIES_PER_MONTH: "1"
          # Direct publishing, same as the blog agent: commit to main and let the
          # site's deploy workflow take it live. Every gate still runs and still
          # aborts — the difference is nobody reads the study before the world
          # does. Tick "open_pr" on a manual run to get a review branch instead.
          OPEN_PR: ${{ inputs.open_pr == true && '1' || '0' }}
          REQUIRE_CLEAN_BRIEF: "1"
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          LOG_LEVEL: INFO
        run: |
          if [ -n "${{ inputs.project }}" ]; then
            python main.py --project "${{ inputs.project }}"
          else
            python main.py
          fi

      # ── Keep the schedule alive ──
      # GitHub disables a scheduled workflow after ~60 days of repository
      # INACTIVITY, and inactivity means no commits — workflow runs do not count.
      # This agent commits to the SITE repo and never to its own, so on a monthly
      # cron the schedule would have silently switched itself off around the third
      # run, with no failure and no notification.
      #
      # A heartbeat commit fixes that and doubles as the run log: every fire is
      # recorded with its outcome, which is the only durable record that a
      # skipped-because-quota-met run happened at all.
      - name: Heartbeat
        if: always() && github.event_name == 'schedule'
        run: |
          mkdir -p .runs
          STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          echo "$STAMP  run=${{ github.run_id }}  outcome=${{ job.status }}" >> .runs/history.log
          tail -n 200 .runs/history.log > .runs/history.tmp
          mv .runs/history.tmp .runs/history.log
          git config user.name "WizCodes Case Study Bot"
          git config user.email "business@wizcodes.site"
          git add .runs/history.log
          git diff --staged --quiet || git commit -m "chore: run log $STAMP"
          git push

      - name: Upload draft artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-study-output
          path: output/
          if-no-files-found: ignore
          retention-days: 14
